name: Bluetooth Build Check

on:
  push:
    branches:
      - feature/pico-w-bluetooth
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        GP2040_BOARDCONFIG:
          - PicoW
          - Pico2W

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 python3-venv gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Checkout Pico SDK
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.3.1
          path: pico-sdk
          submodules: recursive

      - name: Configure CMake
        shell: bash
        run: |
          PICO_SDK_PATH=${{ github.workspace }}/pico-sdk GP2040_BOARDCONFIG=${{ matrix.GP2040_BOARDCONFIG }} SKIP_WEBBUILD=TRUE cmake -B ${{ github.workspace }}/build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build ${{ github.workspace }}/build --parallel
