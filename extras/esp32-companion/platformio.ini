; GP-Link ESP32 companion (PlatformIO, Arduino framework).
; M1: UART link + HELLO/PIN_CAPS + GPIO expander. M2 adds Bluepad32.
[platformio]
default_envs = devkit

[env]
platform = espressif32@7.0.1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
	file://../gp-link
	file://../../lib/CRC32
build_flags =
	-D GPLINK_BAUD=2000000
	-D GPLINK_UART_RX=16
	-D GPLINK_UART_TX=17

; Regular classic-ESP32 dev board (default target).
[env:devkit]
board = esp32dev
build_flags =
	${env.build_flags}
	-D COMPANION_BOARD_NAME='"ESP32-DevKit"'

; Same board at the spec fallback rate (921600) for marginal wiring.
[env:devkit-921600]
board = esp32dev
build_flags =
	${env.build_flags}
	-D GPLINK_BAUD=921600
	-D COMPANION_BOARD_NAME='"ESP32-DevKit"'

; ESPDUINO-32 / Wemos D1 R32 (same WROOM-32 silicon, Uno headers).
[env:r32]
board = esp32dev
build_flags =
	${env.build_flags}
	-D COMPANION_BOARD_R32
	-D COMPANION_BOARD_NAME='"ESPDUINO-R32"'
